<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý danh mục</title>

    <!-- Bootstrap -->
    <link th:href="@{/assets/vendor/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/assets/vendor/bootstrap-icons/bootstrap-icons.css}" rel="stylesheet">

    <!-- DataTable -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

    <style>
        body {
            background: #f6f9ff;
        }

        .card {
            border-radius: 14px;
        }

        .table thead {
            background: #212529;
            color: white;
        }

        .badge-on {
            background: #198754;
        }

        .badge-off {
            background: #dc3545;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <div class="card shadow">
        <div class="card-body">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="fw-bold">Quản lý danh mục</h3>

                <button class="btn btn-primary"
                        data-bs-toggle="modal"
                        data-bs-target="#addModal">
                    <i class="bi bi-plus-circle"></i> Thêm danh mục
                </button>
            </div>

            <table class="table table-striped datatable">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Tên danh mục</th>
                    <th>Slug</th>
                    <th>Trạng thái</th>
                    <th width="180">Thao tác</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="item : ${categories}">
                    <td th:text="${item.id}"></td>
                    <td th:text="${item.name}"></td>
                    <td th:text="${item.slug}"></td>

                    <td>
                        <span th:if="${item.active}" class="badge badge-on">Hoạt động</span>
                        <span th:unless="${item.active}" class="badge badge-off">Ẩn</span>
                    </td>

                    <td>
                        <!-- Edit -->
                        <button class="btn btn-warning btn-sm text-white"
                                name="Sửa"
                                title="Sửa"
                                data-bs-toggle="modal"
                                th:attr="data-bs-target='#editModal_' + ${item.id}">
                            <i class="bi bi-pencil-square"></i>
                        </button>

                        <!-- Toggle -->
                        <a th:href="@{/admin/categories/toggle/{id}(id=${item.id})}"
                           class="btn btn-secondary btn-sm"
                           title="Chuyển đổi trạng thái">
                            <i class="bi bi-arrow-repeat"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>

</div>

<!-- ADD MODAL -->
<div class="modal fade" id="addModal">
    <div class="modal-dialog">
        <div class="modal-content">

            <form th:action="@{/admin/categories/save}" method="post">

                <div class="modal-header">
                    <h5 class="modal-title">Thêm danh mục</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <div class="mb-3">
                        <label>Tên danh mục</label>
                        <input type="text" name="name" id="addName"
                               class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label>Slug</label>
                        <input type="text" name="slug" id="addSlug"
                               class="form-control" required>
                    </div>

                    <input type="hidden" name="active" value="true">

                </div>

                <div class="modal-footer">
                    <button class="btn btn-primary">Lưu</button>
                </div>

            </form>

        </div>
    </div>
</div>

<!-- EDIT MODALS -->
<div th:each="item : ${categories}">
    <div class="modal fade" th:id="'editModal_' + ${item.id}">
        <div class="modal-dialog">
            <div class="modal-content">

                <form th:action="@{/admin/categories/save}" method="post">

                    <div class="modal-header">
                        <h5 class="modal-title">Sửa danh mục</h5>
                        <button type="button" class="btn-close"
                                data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">

                        <input type="hidden" name="id"
                               th:value="${item.id}">

                        <div class="mb-3">
                            <label>Tên danh mục</label>
                            <input type="text"
                                   name="name"
                                   class="form-control editName"
                                   th:value="${item.name}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label>Slug</label>
                            <input type="text"
                                   name="slug"
                                   class="form-control editSlug"
                                   th:value="${item.slug}"
                                   required>
                        </div>

                        <input type="hidden" name="active"
                               th:value="${item.active}">

                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-warning text-white">Cập nhật</button>
                    </div>

                </form>

            </div>
        </div>
    </div>
</div>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script th:src="@{/assets/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script>
    $(document).ready(function () {
        $('.datatable').DataTable({
            language: {
                search: "Tìm kiếm:",
                lengthMenu: "Hiển thị _MENU_ mục",
                info: "Hiển thị _START_ đến _END_ / _TOTAL_ mục",
                paginate: {
                    previous: "Trước",
                    next: "Sau"
                }
            }
        });
    });
</script>

<script>
    function slugify(str) {
        return str.toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/đ/g, "d")
            .replace(/[^a-z0-9 ]/g, "")
            .trim()
            .replace(/\s+/g, "-");
    }

    $('#addName').keyup(function () {
        $('#addSlug').val(slugify($(this).val()));
    });
</script>

</body>
</html>
