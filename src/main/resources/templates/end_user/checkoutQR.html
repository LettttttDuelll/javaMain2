<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán QR</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <style>
        body {
            background: linear-gradient(135deg, #f8f9ff, #eef1ff);
            min-height: 100vh;
        }

        .checkout-box {
            max-width: 520px;
            margin: 60px auto;
            background: #fff;
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.08);
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            color: #5b21b6;
        }

        .qr-box {
            background: #fafafa;
            border: 2px dashed #ddd;
            border-radius: 20px;
            padding: 20px;
        }

        .money {
            font-size: 28px;
            font-weight: 800;
            color: #dc2626;
        }

        .info-label {
            font-weight: 600;
            color: #6b7280;
        }

        .btn-main {
            background: linear-gradient(135deg, #7c3aed, #ec4899);
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px;
            border-radius: 14px;
        }

        .btn-main:hover {
            opacity: 0.95;
            color: white;
        }

        .countdown {
            font-weight: 700;
            color: #ea580c;
        }

        .note {
            font-size: 14px;
            color: #6b7280;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="checkout-box text-center">

        <div class="title mb-3">Thanh toán bằng QR</div>

        <p class="text-muted mb-4">
            Mã đơn hàng:
            <strong>#<span th:text="${order.id}"></span></strong>
        </p>

        <div class="qr-box mb-4">
            <img th:src="${qrUrl}" alt="QR Code" class="img-fluid" style="max-width: 260px;">
        </div>

        <div class="mb-2 info-label">Tổng thanh toán</div>
        <div class="money mb-3">
            <span th:text="${#numbers.formatDecimal(tongTien,0,'COMMA',0,'POINT')}"></span> VNĐ
        </div>

        <div class="mb-2">
            <span class="info-label">Nội dung chuyển khoản:</span>
            <strong th:text="'DH' + ${order.id}"></strong>
        </div>

        <div class="mb-4">
            <span class="info-label">Thời gian giữ đơn:</span>
            <span class="countdown" id="timer">10:00</span>
        </div>

        <div class="d-grid gap-2">
            <a href="/order/orderconfirm" class="btn btn-main">
                Tôi đã thanh toán
            </a>

            <a href="/home" class="btn btn-outline-secondary">
                Thanh toán sau
            </a>
        </div>

        <p class="note mt-4 mb-0">
            Sau khi chuyển khoản, nhấn "Tôi đã thanh toán" để tiếp tục.
        </p>

    </div>
</div>

<script>
    let totalSeconds = 600;

    function updateTimer() {
        let minutes = Math.floor(totalSeconds / 60);
        let seconds = totalSeconds % 60;

        document.getElementById("timer").innerText =
            String(minutes).padStart(2, '0') + ":" +
            String(seconds).padStart(2, '0');

        if (totalSeconds > 0) {
            totalSeconds--;
        }
    }

    setInterval(updateTimer, 1000);
    updateTimer();
</script>

</body>
</html>
